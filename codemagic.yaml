workflows:
  navigator-ios:
    name: Navigator 2.0 iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Navigator App Store

    environment:
      # Configure deployment values in the protected Codemagic environment.
      # No live service configuration is stored in this source package.
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.projectnavigator.app

    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund

      - name: Validate protected deployment configuration
        script: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Navigator deployment configuration missing."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Navigator deployment configuration missing."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Navigator deployment configuration missing."; exit 1; }
          test -n "$CAPACITOR_SERVER_URL" || { echo "Navigator deployment URL missing."; exit 1; }
          case "$CAPACITOR_SERVER_URL" in https://*) ;; *) echo "Navigator deployment URL must use HTTPS."; exit 1;; esac

      - name: Validate Navigator 2.0 release
        script: npm run validate:release

      - name: Typecheck Navigator
        script: npm run typecheck

      - name: Build Navigator server application
        script: npm run build

      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles --archive-method app-store

      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist=/Users/builder/export_options.plist

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    artifacts:
      - build/ios/ipa/*.ipa
