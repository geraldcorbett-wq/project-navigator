workflows:
  navigator-ios:
    name: Navigator iOS POC
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://lzpfyvmafrzzpcalrrua.supabase.co"
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_x4jYYvwe21_7E5WEiR-M7g_HWE-iySz"
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.projectnavigator.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify Supabase environment
        script: |
          echo "URL=https://lzpfyvmafrzzpcalrrua.supabase.co"
          if [ -n "sb_publishable_x4jYYvwe21_7E5WEiR-M7g_HWE-iySz" ]; then
            echo "KEY=present"
          else
            echo "KEY=missing"
          fi

      - name: Build Navigator
        script: npm run build
        
      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --archive-method app-store
      
      - name: Build signed iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa