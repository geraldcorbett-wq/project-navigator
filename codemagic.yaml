workflows:
  navigator-ios:
    name: Navigator iOS POC
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://lzpfyvmafrzzpcalrrua.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_x4jYYvwe21_7E5WEiR-M7g_HWE-iySz"
      node: 22
      xcode: latest
      cocoapods: default

        scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify Supabase environment
        script: |
          echo "URL=https://lzpfyvmafrzzpcalrrua.supabase.co"
          if [ -n "sb_publishable_x4jYYvwe21_7E5WEiR-M7g_HWE-iySz" ]; then
            echo "KEY=present"
          else
            echo "KEY=missing"
          fi

      - name: Build Navigator
        script: npm run build
        
      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/App.app